[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isars"
version = "1.0.0"
description = "Interval selection for adversarial rank suppression in video retrieval"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
attack = ["torch>=2.1"]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[project.scripts]
isars = "isars.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
isars = ["reported_results.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
